services:
  xui:
    # Pin the reference image; update deliberately and re-test before changing it.
    image: alireza7/x-ui@sha256:1dbf49e4307a2ceb543070108efce535cf1a06919269111fcc7a44d0de301989
    container_name: x-ui
    hostname: xui-server
    volumes:
      - ./db/:/etc/x-ui/
      - ./cert/:/root/cert/
    environment:
      XRAY_VMESS_AEAD_FORCED: "false"
    tty: true
    network_mode: host
    cap_add:
      - NET_ADMIN
    mem_limit: 512m
    cpus: "1.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    # 资源限制（可选，防止内存泄漏影响系统）
    # deploy:
    #   resources:
    #     limits:
    #       memory: 512M
    #       cpus: '0.5'
